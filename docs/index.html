<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="整理《經濟學人》文章、英文全文與繁體中文研究摘要，協助研究員快速掌握國際政經、金融市場與產業議題。"
    />
    <title>《經濟學人》中文研究摘要</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260816-3" />
  </head>
  <body>
    <a class="skip-link" href="#articles">跳至文章列表</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="#top" aria-label="回到頁首">
          <span class="brand-mark">ER</span>
          <span>
            <strong>《經濟學人》中文研究摘要</strong>
            <small>Economist Research Reader</small>
          </span>
        </a>
        <nav aria-label="主要導覽">
          <a href="#articles">文章索引</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="shell">
          <div class="hero-copy">
            <p class="eyebrow">RESEARCH READING DESK · 研究摘要</p>
            <h1>《經濟學人》文章索引與中文摘要</h1>
            <p class="hero-lead">
              每週整理《經濟學人》文章，提供繁體中文研究摘要與可展開閱讀的英文全文。
            </p>
          </div>
        </div>
      </section>

      <section class="content-section">
        <div class="shell">
          <div class="section-heading">
            <div>
              <p class="eyebrow red">ARTICLE DATABASE</p>
              <h2>文章索引</h2>
            </div>
            <p>從主題、日期或關鍵字開始，搜尋中英文內容。每篇依序整理論述重點、中文摘要、研究閱讀角度與英文全文。</p>
          </div>

          <div class="toolbar" id="articles">
            <label class="search-box">
              <span class="sr-only">搜尋文章</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
              <input id="search-input" type="search" placeholder="搜尋英文全文、中文摘要或關鍵字…" />
            </label>
            <div class="toolbar-actions">
              <button class="favorites-filter" id="favorites-filter" type="button" aria-pressed="false">
                <span class="favorite-symbol" aria-hidden="true">☆</span>
                我的收藏
                <small id="favorites-count">0</small>
              </button>
              <label class="select-control issue-control">
                <span class="control-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 2v3m10-3v3M3.5 9h17M5.5 4.5h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2Z" /></svg>
                </span>
                <select id="issue-select" aria-label="文章期數"></select>
              </label>
              <label class="select-control sort-control">
                <span class="control-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M8 6h11M8 12h8M8 18h5M4 4v16m0 0-2.5-2.5M4 20l2.5-2.5" /></svg>
                </span>
                <select id="sort-select" aria-label="文章排序方式">
                  <option value="newest">日期：新到舊</option>
                  <option value="oldest">日期：舊到新</option>
                  <option value="category">依主題分類</option>
                </select>
              </label>
            </div>
          </div>

          <div class="filter-row" id="category-filters" aria-label="主題分類篩選"></div>
          <div class="results-meta">
            <p class="result-count" id="result-count" aria-live="polite"></p>
            <button class="clear-filters" id="clear-filters" type="button" hidden>清除篩選</button>
          </div>
          <div class="article-list" id="article-list"></div>
          <nav class="pagination" id="pagination" aria-label="文章分頁" hidden>
            <button class="page-step" id="previous-page" type="button">← 上一頁</button>
            <div class="page-numbers" id="page-numbers"></div>
            <button class="page-step" id="next-page" type="button">下一頁 →</button>
          </nav>
          <div class="empty-state" id="empty-state" hidden>
            <strong>找不到符合條件的文章</strong>
            <p>試著縮短搜尋文字，或切換其他主題。</p>
          </div>
        </div>
      </section>

    </main>

    <footer>
      <div class="shell footer-inner">
        <p>《經濟學人》中文研究摘要</p>
        <p>每週整理 · 中英文研究閱讀</p>
      </div>
    </footer>

    <template id="article-template">
      <article class="article-card">
        <div class="card-intro">
          <button class="favorite-button" type="button" aria-pressed="false" title="加入收藏">
            <span aria-hidden="true">☆</span>
            <span class="sr-only">加入收藏</span>
          </button>
          <div class="card-meta">
            <span class="category-label"></span>
            <span class="section-label"></span>
            <time></time>
          </div>
          <h3 class="article-title"></h3>
          <p class="rubric"></p>
          <p class="search-match-reasons" hidden></p>
          <a class="source-link" target="_blank" rel="noreferrer">前往《經濟學人》原站 <span>↗</span></a>
          <div class="tags" aria-label="文章關鍵字"></div>
        </div>

        <div class="card-reading">
          <div class="summary-block">
            <section class="reading-section key-points-section">
              <h4>論述重點</h4>
              <ul class="key-points"></ul>
            </section>
            <section class="reading-section">
              <h4>中文摘要</h4>
              <p class="summary"></p>
            </section>
            <section class="reading-section research-lens-section">
              <h4>研究閱讀角度</h4>
              <p class="research-lens"></p>
            </section>
            <details class="internal-english-block" hidden>
              <summary>閱讀英文全文</summary>
              <div class="english-full-text"></div>
            </details>
          </div>
          <div class="pending-block">
            <span>摘要產製中</span>
            <p>這篇文章會在本期處理完成後補上中文內容。</p>
          </div>
        </div>
      </article>
    </template>

    <script src="./app.js?v=20260816-4" defer></script>
  </body>
</html>
