name: Weekly Economist update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-update.yml"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      test_azure:
        description: "只測試 Azure OpenAI 連線，不重跑既有摘要"
        required: false
        type: boolean
        default: false
  schedule:
    # Asia/Taipei 週五 13:17–週六 01:17，每兩小時檢查一次。
    # 避開整點可降低 GitHub Actions 尖峰排隊與延遲機率。
    - cron: "17 5-17/2 * * 5"
    # 週六 11:17 再做一次補查，因應來源延遲。
    - cron: "17 3 * * 6"

concurrency:
  group: weekly-economist-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 一期約 70–80 篇，包含導讀與全文的翻譯、自然化及定稿；保留足夠處理時間。
    timeout-minutes: 240
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_PATH: /openai/v1/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test update safeguards
        run: node --test tests/*.test.mjs

      - name: Test Azure OpenAI connection
        if: ${{ inputs.test_azure == true }}
        run: node scripts/test-azure-openai.mjs

      - name: Restore partial summary checkpoints
        if: ${{ !inputs.test_azure }}
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/summaries.checkpoint.json
            .cache/humanized-summaries.checkpoint.json
            .cache/fulltext-zh-v2.checkpoint.json
          key: economist-checkpoints-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            economist-checkpoints-${{ runner.os }}-

      - name: Detect and process a new issue
        if: ${{ !inputs.test_azure }}
        id: process
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .cache
          set -o pipefail
          node scripts/update-latest.mjs 2>&1 | tee .cache/update-latest.log

      - name: Translate and edit missing Chinese full text
        if: ${{ !inputs.test_azure && steps.process.outcome == 'success' && steps.process.outputs.content_changed == 'true' }}
        id: translate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/translate-fulltext-zh.mjs --workers=5 2>&1 | tee .cache/translate-fulltext.log

      - name: Audit full-text coverage and rebuild the manifest
        if: ${{ !inputs.test_azure && steps.process.outcome == 'success' && steps.process.outputs.content_changed == 'true' && steps.translate.outcome == 'success' }}
        id: audit_fulltext
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-fulltext-zh.mjs 2>&1 | tee .cache/audit-fulltext.log

      - name: Save partial summary checkpoints
        if: ${{ !inputs.test_azure && always() && hashFiles('.cache/*.checkpoint.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/summaries.checkpoint.json
            .cache/humanized-summaries.checkpoint.json
            .cache/fulltext-zh-v2.checkpoint.json
          key: economist-checkpoints-${{ runner.os }}-${{ github.run_id }}

      - name: Write clear run diagnostics
        if: ${{ !inputs.test_azure && always() }}
        env:
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
          TRANSLATE_OUTCOME: ${{ steps.translate.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit_fulltext.outcome }}
        run: node scripts/write-update-run-summary.mjs

      - name: Publish public maintenance diagnosis
        if: ${{ !inputs.test_azure && always() }}
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const path = "docs/data/maintenance-status.json";
            const nextStatus = JSON.parse(fs.readFileSync(path, "utf8"));
            let current = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main",
              });
              current = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const currentContent = current?.content ? Buffer.from(current.content, "base64").toString("utf8") : null;
            const currentStatus = currentContent ? JSON.parse(currentContent) : null;
            const mergedHistory = [...(nextStatus.history || []), ...(currentStatus?.history || [])]
              .filter((item, index, values) => values.findIndex(
                (candidate) => candidate.runId === item.runId && (candidate.runAttempt || 1) === (item.runAttempt || 1),
              ) === index)
              .sort((a, b) => String(b.recordedAt || "").localeCompare(String(a.recordedAt || "")))
              .slice(0, 30);
            const nextContent = `${JSON.stringify({ ...nextStatus, history: mergedHistory }, null, 2)}\n`;
            if (currentContent === nextContent) {
              core.notice("公開維運診斷內容未變，不建立重複提交。");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: "main",
              message: "Update public maintenance diagnosis",
              content: Buffer.from(nextContent).toString("base64"),
              ...(current?.sha ? { sha: current.sha } : {}),
            });
            core.notice("已更新公開維運診斷。");

      - name: Stop when issue processing, translation or audit failed
        if: ${{ !inputs.test_azure && (steps.process.outcome == 'failure' || steps.translate.outcome == 'failure' || steps.audit_fulltext.outcome == 'failure') }}
        run: exit 1

      - name: Publish updated site data
        if: ${{ !inputs.test_azure }}
        run: |
          if [ -z "$(git status --porcelain -- docs/data/articles.json docs/data/fulltext)" ]; then
            echo "No new issue to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.json docs/data/fulltext
          git commit -m "Update Economist issue"
          git pull --rebase origin main
          git push
