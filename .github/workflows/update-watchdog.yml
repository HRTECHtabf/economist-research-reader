name: Economist update watchdog

on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 每天 12:47 獨立檢查上游、GitHub 資料與公開網站。
    # 週六執行時間晚於原更新流程的 11:17 補查。
    - cron: "47 4 * * *"
    # 週六 15:47、19:47 再檢查兩次；GitHub 排程若延遲，仍有後續自癒窗口。
    - cron: "47 7,11 * * 6"

concurrency:
  group: economist-update-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SITE_DATA_URL: https://hrtechtabf.github.io/economist-research-reader/data/articles.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Compare upstream, repository data and public site
        id: health
        run: node scripts/check-update-health.mjs --site-url="$SITE_DATA_URL"

      - name: Record healthy status
        if: ${{ success() }}
        shell: bash
        run: |
          echo "## Economist 更新防呆：正常" >> "$GITHUB_STEP_SUMMARY"
          echo "上游最新一期、GitHub 主資料、繁中全文覆蓋率與公開網站一致。" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger a self-healing update when repository data is stale
        if: ${{ failure() && steps.health.outputs.source_current != 'true' }}
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "weekly-update.yml";
            const activeStatuses = ["queued", "in_progress", "waiting", "requested", "pending"];
            const activeRuns = [];
            for (const status of activeStatuses) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: "main",
                status,
                per_page: 1,
              });
              activeRuns.push(...response.data.workflow_runs);
            }
            if (activeRuns.length) {
              core.notice("已有更新工作在排隊或執行，不重複觸發。");
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "main",
            });
            core.notice("已自動觸發 Weekly Economist update 補跑。");

      - name: Record maintenance guidance
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "## Economist 更新防呆：需要處理" >> "$GITHUB_STEP_SUMMARY"
          echo "看門狗發現上游、GitHub 資料、繁中全文覆蓋率或公開網站不同步。" >> "$GITHUB_STEP_SUMMARY"
          echo "若 GitHub 主資料落後，看門狗會自動觸發 Weekly Economist update；若只有公開網站落後，請重新執行 Pages build。" >> "$GITHUB_STEP_SUMMARY"

      - name: Save watchdog result and failure reason
        if: ${{ always() }}
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          SOURCE_CURRENT: ${{ steps.health.outputs.source_current }}
          SITE_CURRENT: ${{ steps.health.outputs.site_current }}
          HEALTH_SUMMARY: ${{ steps.health.outputs.health_summary }}
        run: node scripts/write-watchdog-run-history.mjs

      - name: Publish watchdog history
        if: ${{ always() }}
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const path = "docs/data/maintenance-status.json";
            const localStatus = JSON.parse(fs.readFileSync(path, "utf8"));
            let current = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main",
              });
              current = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const currentContent = current?.content ? Buffer.from(current.content, "base64").toString("utf8") : null;
            const currentStatus = currentContent ? JSON.parse(currentContent) : localStatus;
            const mergedHistory = [...(localStatus.history || []), ...(currentStatus.history || [])]
              .filter((item, index, values) => values.findIndex(
                (candidate) => candidate.runId === item.runId && (candidate.runAttempt || 1) === (item.runAttempt || 1),
              ) === index)
              .sort((a, b) => String(b.recordedAt || "").localeCompare(String(a.recordedAt || "")))
              .slice(0, 30);
            const nextContent = `${JSON.stringify({ ...currentStatus, version: 2, history: mergedHistory }, null, 2)}\n`;
            if (currentContent === nextContent) {
              core.notice("防呆紀錄未變，不建立重複提交。");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: "main",
              message: "Update watchdog diagnosis history",
              content: Buffer.from(nextContent).toString("base64"),
              ...(current?.sha ? { sha: current.sha } : {}),
            });
            core.notice("已公開防呆執行原因。");
